name: Build and deploy Node.js app to Azure Web App - healthcare-erp-frontend
on:
  push:
    branches:
      - feature/auth
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present
      - name: Verify next binary exists
        run: ls -la node_modules/.bin/ | grep next
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./frontend
          include-hidden-files: true
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A49D7C37C67B453092D6C85D21909DC2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_381A7B3504FB4E8E896D7A151F8E9618 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BE8CBE4F09F94AAA9F788BAC7AEDF6B9 }}
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'healthcare-erp-frontend'
          slot-name: 'Production'
          package: .
